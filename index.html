function playlist(a,b,n){const used=new Set(),out=[];for(let i=0;i<n;i++){const t=i/(n-1),p={e:a.e+(b.e-a.e)*t,v:a.v+(b.v-a.v)*t};const hit=nearest(p,1,used)[0];used.add(hit.s.id);out.push(hit.s)}return out}

function convex(P){if(P.length<3)return P;P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];for(const p of P){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}for(const p of P.reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}up.pop();lo.pop();return lo.concat(up)}

function creatorsOf(id,hide){return BYID[id].cr.filter(c=>!(hide&&MEMBERS.has(c.n)))}
function recsFor(id){const mine=new Set(BYID[id].cr.filter(c=>!MEMBERS.has(c.n)).map(c=>c.n));return SONGS.filter(s=>s.id!==id).map(s=>({s,sh:s.cr.filter(c=>mine.has(c.n)).map(c=>c.n)})).filter(x=>x.sh.length).sort((a,b)=>b.sh.length-a.sh.length||a.s.y-b.s.y).slice(0,3)}

  const node=(kind,x,y,inner,attrs)=>{const f=fromOf(kind);const s=f?`transform:translate(${f.x}px,${f.y}px) scale(.4);opacity:0`:`transform:translate(${x}px,${y}px)`;return `<g class="nd" ${attrs} data-to="${x},${y}" style="${s}">${inner}</g>`};

  crs.forEach(cr=>{const p=pos[cr.n],sel=cr.n===D.creator;g+=`<g class="${lineFade('creator')}" data-edgeof="${esc(cr.n)}"><line x1="${CX}" y1="${CY}" x2="${p.x}" y2="${p.y}" stroke="${sel?'#1C1B18':'rgba(28,27,24,.45)'}" stroke-width="${(sel?1.6:1)*(0.6+cr.r.length*.7)}"/><line data-edge="${esc(cr.n)}" x1="${CX}" y1="${CY}" x2="${p.x}" y2="${p.y}" stroke="transparent" stroke-width="14"/></g>`});
  g+=`<g class="${lineFade('outer')}">${outer.map(o=>`<line x1="${selP.x}" y1="${selP.y}" x2="${o.x}" y2="${o.y}" stroke="#1C1B18" stroke-width="1.6"/>`).join('')}</g>`;

/* ===== 歌曲连线 ===== */
function findPaths(a,b,hide,excl){
  const ok=n=>!(hide&&MEMBERS.has(n))&&n!==excl;
  const adj=k=>{if(k[0]==='s')return BYID[k.slice(2)].cr.filter(c=>ok(c.n)).map(c=>'c:'+c.n);return CRE[k.slice(2)].map(x=>'s:'+x.id)};
  const A='s:'+a,B='s:'+b;if(a===b)return [];
  const dist={[A]:0},par={[A]:[]},q=[A];let found=-1;
  while(q.length){const u=q.shift();if(found>=0&&dist[u]>=found)break;for(const w of adj(u)){if(!(w in dist)){dist[w]=dist[u]+1;par[w]=[u];q.push(w);if(w===B)found=dist[w]}else if(dist[w]===dist[u]+1)par[w].push(u)}}
  if(!(B in dist))return null;
  const out=[];(function walk(n,acc){if(out.length>=12)return;if(n===A){out.push([A,...acc].map(k=>k));return}for(const p of par[n])walk(p,[n,...acc])})(B,[]);
  return out;
}
function runRoute(){const R=S.route;R.paths=findPaths(R.a,R.b,R.hide,R.excl);R.i=0}

  const R=S.route;if(R.paths===null&&R.a&&R.b&&!R.ran){runRoute();R.ran=true}
  const st=$('#stage');const A=BYID[R.a],B=BYID[R.b];
  let body='',foot='';
  if(R.paths===null){const iso=s2=>s2.cr.every(c=>CRE[c.n].length===1);const why=iso(A)?A.t:iso(B)?B.t:null;body=`<div class="netwrap"><div class="wash"></div><div class="empty"><div><p style="margin:0 0 8px;font-size:20px;font-weight:900;color:var(--ink)">${esc(A.t)} 和 ${esc(B.t)} 之间找不到连接</p>${why?`<p style="margin:0">在演示数据里，${esc(why)} 的创作者没有参与其他 BTS 歌曲。</p>`:`<p style="margin:0">试试取消“隐藏 BTS 成员”或“排除创作者”。</p>`}</div></div></div>`}
  else if(R.paths.length===0){body=`<div class="netwrap"><div class="empty">起点和终点是同一首歌，换一首试试。</div></div>`}
  else{
    const path=R.paths[R.i],k=path.length;const xs=path.map((_,i)=>110+i*(780/(k-1)));
    let g=`<g fill="none" stroke="rgba(28,27,24,.2)" stroke-dasharray="3 6">${[110,210,310].map(r=>`<circle cx="110" cy="190" r="${r}"/><circle cx="890" cy="190" r="${r}"/>`).join('')}</g>`;
    g+=`<polyline points="${path.map((n,i)=>xs[i]+','+(n[0]==='s'?190:370)).join(' ')}" fill="none" stroke="#1C1B18" stroke-width="3" stroke-linejoin="round"/>`;
    path.forEach((n,i)=>{const x=xs[i];if(n[0]==='s'){const s=BYID[n.slice(2)];const fs=k>5&&s.t.length>12?20:s.t.length>16?24:30;const lab=i===0?'起点':i===k-1?'终点':'中转';
      g+=`<g data-song="${s.id}" role="button" tabindex="0" aria-label="${esc(s.t)}，在创作图谱中打开"><text x="${x}" y="104" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#55524A">${lab} · ${s.y}</text><text x="${x}" y="142" text-anchor="middle" font-family="Instrument Serif,serif" font-size="${fs}" fill="#1C1B18">${esc(s.t)}</text><circle cx="${x}" cy="190" r="${i===0||i===k-1?24:20}" fill="${colorAt(s.e,s.v)}" stroke="#1C1B18" stroke-width="2.5"/></g>`}
      else{const nm=n.slice(2),mem=MEMBERS.has(nm);const sa=BYID[path[i-1].slice(2)],sb=BYID[path[i+1].slice(2)];const ra=sa.cr.find(c=>c.n===nm).r,rb=sb.cr.find(c=>c.n===nm).r;
      g+=`<rect x="${x-14}" y="356" width="28" height="28" fill="${mem?'#1C1B18':'#EEE9DF'}" stroke="#1C1B18" stroke-width="2.5"/><text x="${x}" y="414" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="18" font-weight="700" fill="#1C1B18">${esc(nm)}</text>
      <text x="${x}" y="434" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="12" fill="#3F3D37">两首歌都有${mem?'他':'TA'}的署名</text>
      <text x="${x}" y="452" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="11" fill="#55524A">${roles(ra)}｜${roles(rb)}</text>`}});
    body=`<div class="netwrap"><div class="wash"></div><svg class="net" id="rsvg" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="连线路径">${g}</svg><p class="note" style="position:absolute;left:0;bottom:4px">点歌名可在创作图谱中打开 · 虚线圆圈表示从两首歌同时向外查找</p></div>`;
    const songs=path.filter(n=>n[0]==='s').map(n=>BYID[n.slice(2)]);
    foot=`<div style="flex:none;display:flex;gap:22px;align-items:stretch;border-top:1px solid var(--rule);padding-top:16px;margin-top:10px;flex-wrap:wrap">
      <div class="mini" style="width:220px;height:136px;flex:none" aria-hidden="true"><div class="field"></div><div class="axh"></div><div class="axv"></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><polyline points="${songs.map(s=>px(s.e)+','+py(s.v)).join(' ')}" fill="none" stroke="#1C1B18" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>${songs.map(s=>`<span class="d" style="left:${px(s.e)}%;top:${py(s.v)}%;width:10px;height:10px;margin:-5px;background:${colorAt(s.e,s.v)};box-shadow:0 0 0 1.5px #1C1B18"></span>`).join('')}</div>
      <div style="flex:1;min-width:220px;display:flex;flex-direction:column;justify-content:space-between;gap:10px"><div><p class="lab">这条路线也是一份歌单</p><p style="margin:6px 0 0;font-size:15px">从 <b>${desc(songs[0].e,songs[0].v)}</b> 走到 <b>${desc(songs[songs.length-1].e,songs[songs.length-1].v)}</b></p><p class="serif" style="margin:4px 0 0;font-size:22px">${songs.map(s=>esc(s.t)).join(' → ')}</p></div>
      <div><button class="btn p" id="onMap">在情绪地图上看这条路线 →</button></div></div></div>`;
  }
  const many=R.paths&&R.paths.length>1;
  st.innerHTML=`<div class="bar"><p class="lab">${R.paths&&R.paths.length?'路线 '+(R.i+1)+' / '+R.paths.length+(R.paths.length>=12?'+':''):'歌曲连线'}</p><div style="display:flex;gap:6px"><button class="btn q" id="prevP" aria-label="上一条路线" ${many?'':'disabled'} style="padding:8px 12px">←</button><button class="btn" id="nextP" aria-label="下一条路线" ${many?'':'disabled'} style="padding:8px 12px">→</button></div></div>${body}${foot}`;
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on('prevP',()=>{R.i=(R.i-1+R.paths.length)%R.paths.length;render()});
  on('nextP',()=>{R.i=(R.i+1)%R.paths.length;render()});
  on('onMap',()=>{S.mapRoute=R.paths[R.i].filter(n=>n[0]==='s').map(n=>n.slice(2));S.draw=null;S.foot=null;go('map')});
  const rs=$('#rsvg');if(rs){const act=t=>{const so=t.closest('[data-song]');if(so){S.dna.trail=[];S.dna.center=null;setCenter(so.dataset.song);go('dna')}};rs.addEventListener('click',e=>act(e.target));rs.addEventListener('keydown',e=>{if(e.key==='Enter'){act(e.target)}})}
  renderRoutePanel();
}
function renderRoutePanel(){
  const R=S.route,A=BYID[R.a],B=BYID[R.b];
  const p=R.paths&&R.paths[R.i];const steps=p?(p.length-1)/2:0;
  const direct=p&&p.length===3;
  let res;
  if(R.paths===null)res=`<p class="note" style="font-size:14px;color:var(--ink)">在当前条件下没有找到连接。</p>`;
  else if(!p)res='';
  else res=`<p style="margin:0;display:flex;align-items:baseline;gap:10px"><span class="serif" style="font-size:60px;line-height:1">${steps}</span><span style="font-size:16px;font-weight:700">步就能连上</span></p>
    <p style="margin:0;font-size:14px;line-height:1.6">${direct?'这两首歌<b>有共同的创作者</b>，直接就能连上。':'这两首歌<b>没有共同的创作者</b>，需要经过 '+p.filter((n,i)=>n[0]==='s'&&i>0&&i<p.length-1).map(n=>'<b>'+esc(BYID[n.slice(2)].t)+'</b>').join('、')+' 才能连上。'}同样短的路线一共有 ${R.paths.length}${R.paths.length>=12?'+':''} 条。</p>`;
  const P=$('#panel');
  P.innerHTML=`<div class="sec"><p class="lab">歌曲连线</p><h1 style="margin:2px 0 0;font-size:26px;line-height:1.3;font-weight:900;text-wrap:balance">两首歌之间，<br>隔着哪些创作者？</h1></div>
  <form class="sec" id="rform" style="border-top:0;padding-top:0">
   <label class="fld"><span class="mono" style="font-size:11px;color:var(--ink2)">A</span><i class="sw" style="background:${colorAt(A.e,A.v)};width:14px;height:14px;flex:none"></i><span class="sr">起点歌曲</span><input id="ra" value="${esc(A.t)}" autocomplete="off" placeholder="输入或选择歌曲"></label>
   <button type="button" class="btn q" id="swap" style="align-self:flex-end;padding:6px 12px;font-size:12px">⇅ 交换</button>
   <label class="fld"><span class="mono" style="font-size:11px;color:var(--ink2)">B</span><i class="sw" style="background:${colorAt(B.e,B.v)};width:14px;height:14px;flex:none"></i><span class="sr">终点歌曲</span><input id="rb" value="${esc(B.t)}" autocomplete="off" placeholder="输入或选择歌曲"></label>
   <label class="chk"><input type="checkbox" id="rhide" ${R.hide?'checked':''}><span>隐藏 BTS 成员<span style="display:block;font-size:12px;color:var(--ink2)">成员几乎参与了所有歌，隐藏后能找到更意外的连接</span></span></label>
   <label style="display:flex;flex-direction:column;gap:6px;font-size:14px">排除某位创作者<select id="rexcl" style="height:40px;border:1px solid var(--rule);background:#FBF9F4;padding:0 8px"><option value="">不排除</option>${CNAMES.slice().sort().map(n=>`<option ${n===R.excl?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
   <button class="btn p big" type="submit">查找连接 <span>→</span></button>
   <p class="note" id="rerr" hidden></p>
  </form>
  <div class="sec"><p class="lab">结果</p>${res}</div>
  <div class="sec" style="margin-top:auto"><button class="btn big" id="rnd">随机两首歌，看看怎么连 <span>⟳</span></button></div>`;
  combo($('#ra'),SONG_ITEMS,it=>{R.a=it.id;runRoute();render()});
  combo($('#rb'),SONG_ITEMS,it=>{R.b=it.id;runRoute();render()});
  $('#rform').addEventListener('submit',ev=>{ev.preventDefault();const a=findSong($('#ra').value),b=findSong($('#rb').value);if(!a||!b){const e=$('#rerr');e.hidden=false;e.textContent='没有找到这首歌，请从下拉列表里选择。';return}R.a=a.id;R.b=b.id;R.hide=$('#rhide').checked;R.excl=$('#rexcl').value;runRoute();render()});
  $('#swap').onclick=()=>{[R.a,R.b]=[R.b,R.a];runRoute();render()};
  $('#rnd').onclick=()=>{let a,b;do{a=SONGS[Math.floor(Math.random()*SONGS.length)];b=SONGS[Math.floor(Math.random()*SONGS.length)]}while(a===b);R.a=a.id;R.b=b.id;runRoute();render()};
}

/* ===== 可输入也可选择的下拉框 ===== */
const SONG_ITEMS=()=>SONGS.slice().sort((a,b)=>a.y-b.y||a.t.localeCompare(b.t)).map(s=>({v:s.t,label:s.t,sub:s.y+' · '+s.al,color:colorAt(s.e,s.v),kind:'song',id:s.id,k:s.k}));
const CREATOR_ITEMS=()=>CNAMES.slice().sort((a,b)=>CRE[b].length-CRE[a].length).map(n=>({v:n,label:n,sub:(MEMBERS.has(n)?'BTS 成员':'创作者')+' · '+CRE[n].length+' 首',kind:'creator',id:n}));
let comboClose=null;
function combo(input,items,onPick){
  input.removeAttribute('list');input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');
  const host=input.closest('.fld');host.classList.add('combo');
  const tg=document.createElement('button');tg.type='button';tg.className='combo-tg';tg.setAttribute('aria-label','展开全部选项');tg.textContent='▾';host.appendChild(tg);
  const box=document.createElement('div');box.className='combo-list';box.setAttribute('role','listbox');box.hidden=true;host.appendChild(box);
  let cur=-1,shown=[];
  const draw=(q)=>{q=(q||'').trim().toLowerCase();const all=items();shown=q?all.filter(it=>(it.label+' '+(it.k||'')+' '+it.sub).toLowerCase().includes(q)):all;cur=shown.length?0:-1;
    const head=q?`<p class="combo-h">${shown.length} 个结果</p>`:`<p class="combo-h">全部 ${shown.length} 项 · 也可以直接输入</p>`;
    box.innerHTML=head+(shown.length?shown.map((it,i)=>`<button type="button" role="option" data-i="${i}" class="${i===cur?'on':''}">${it.kind==='song'?`<i class="sw" style="background:${it.color}"></i>`:`<i class="sq ${MEMBERS.has(it.id)?'m':''}"></i>`}<span class="cl">${esc(it.label)}</span><span class="cs">${esc(it.sub)}</span></button>`).join(''):'<p class="combo-h">没有匹配的歌曲，换个关键词试试</p>');
    box.hidden=false;input.setAttribute('aria-expanded','true');if(comboClose&&comboClose!==close)comboClose();comboClose=close};
  const close=()=>{box.hidden=true;input.setAttribute('aria-expanded','false');if(comboClose===close)comboClose=null};
  const pick=i=>{const it=shown[i];if(!it)return;input.value=it.v;close();onPick(it)};
  const mark=()=>box.querySelectorAll('[data-i]').forEach(b=>{const on=+b.dataset.i===cur;b.classList.toggle('on',on);if(on)b.scrollIntoView({block:'nearest'})});
  input.addEventListener('focus',()=>{input.select();draw('')});
  input.addEventListener('input',()=>draw(input.value));
  input.addEventListener('keydown',e=>{if(box.hidden&&e.key==='ArrowDown'){draw(input.value);return}
    if(e.key==='ArrowDown'){e.preventDefault();cur=Math.min(shown.length-1,cur+1);mark()}else if(e.key==='ArrowUp'){e.preventDefault();cur=Math.max(0,cur-1);mark()}else if(e.key==='Enter'){if(!box.hidden&&cur>=0){e.preventDefault();pick(cur)}}else if(e.key==='Escape'){close()}});
  box.addEventListener('mousedown',e=>e.preventDefault());
  box.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const b=e.target.closest('[data-i]');if(b)pick(+b.dataset.i)});
  tg.addEventListener('mousedown',e=>e.preventDefault());
  tg.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(box.hidden){input.focus();draw('')}else close()});
  input.addEventListener('blur',()=>setTimeout(close,120));
}
document.addEventListener('click',e=>{if(comboClose&&!e.target.closest('.combo'))comboClose()});

/* ===== 启动 ===== */
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==='map')drawMapLayer()},120)});
S.route.paths=null;
render();
</script>
</body></html>
